<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة تحكم | برشلونة نيوز</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f1f3f6;
      color: #111;
    }

    header {
      background: linear-gradient(135deg, #071952, #8b0015);
      color: white;
      padding: 20px;
    }

    header div {
      max-width: 1000px;
      margin: auto;
    }

    header h1 {
      font-size: 24px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 7px;
      background: #8b0015;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #333;
      margin-top: 10px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .news-list {
      display: grid;
      gap: 15px;
    }

    .news-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
    }

    .news-item h3 {
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 15px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>🔵🔴 لوحة تحكم برشلونة نيوز</h1>
  </div>
</header>

<main>

  <div class="card">

    <h2>➕ إضافة خبر جديد</h2>

    <form id="news-form">

      <label for="title">عنوان الخبر</label>
      <input
        type="text"
        id="title"
        placeholder="اكتب عنوان الخبر"
        required
      >

      <label for="content">محتوى الخبر</label>
      <textarea
        id="content"
        placeholder="اكتب تفاصيل الخبر..."
        required
      ></textarea>

      <label for="category">القسم</label>

      <select id="category">
        <option value="أخبار برشلونة">أخبار برشلونة</option>
        <option value="الانتقالات">الانتقالات</option>
        <option value="المباريات">المباريات</option>
        <option value="الإصابات">الإصابات</option>
        <option value="تصريحات">تصريحات</option>
      </select>

      <label for="image">رابط صورة الخبر</label>

      <input
        type="url"
        id="image"
        placeholder="https://..."
      >

      <button type="submit">
        نشر الخبر
      </button>

      <div id="status" class="status"></div>

    </form>

    <button class="logout" id="logout">
      تسجيل الخروج
    </button>

  </div>

  <div class="card">

    <h2>📰 الأخبار المنشورة</h2>

    <div id="news-list" class="news-list">

      <p>جاري تحميل الأخبار...</p>

    </div>

  </div>

</main>
<script src="admin.js"></script> 
</body>
</html>
